# Fly.io configuration for ARTEX (uses an upstream prebuilt image).
# Keep region gru: existing encrypted data volume is in gru.
app = "artex-global-py"
primary_region = "gru"

# Pull a known published image instead of building the original Dockerfile.
[build]
  image = "ghcr.io/jiwoochris/artex-global:v0.3.15-global.1"

[env]
  ARTEX_LANG = "es"

[[mounts]]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
