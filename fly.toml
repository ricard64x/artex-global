# fly.toml app configuration file generated for artex-global-py on 2026-11-19T22:28:06Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'artex-global-py'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ARTEX_LANG = 'es'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
