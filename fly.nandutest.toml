# Safe in-place Ñandutest rollout. Keeps original data volume and Fly app.
# The original pinned upstream deployment remains defined in fly.toml for rollback.
app = "artex-global-py"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.nandutest"

[env]
  ARTEX_LANG = "es"
  NANDUTEST_DELEGATED_ENABLED = "0"
  NANDUTEST_DISABLE_SELFUPDATE = "1"
  NANDUTEST_PENTEST_AUTHORIZED_DEFAULT = "1"

[[mounts]]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "20s"
  timeout = "5s"
  grace_period = "45s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
