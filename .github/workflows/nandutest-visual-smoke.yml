name: Ñandutest safe production visual smoke

on:
  push:
    branches: ["deploy/nandutest-production"]
    paths:
      - ".github/workflows/nandutest-visual-smoke.yml"
      - "scripts/nandutest_visual_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser harness
        run: |
          python -m pip install --disable-pip-version-check playwright
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Check production API and visually exercise button with isolated synthetic browser responses
        run: python scripts/nandutest_visual_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nandutest-visual-safe-mock
          path: artifacts/nandutest-visual/*.png
          if-no-files-found: warn
          retention-days: 3
