name: Ñandutest production guarded release
# Retry 2: generic failed-login responses retained for legacy ARTEX compatibility.

on:
  push:
    branches: ["deploy/nandutest-production"]
    paths:
      - ".github/workflows/nandutest-prod-release.yml"
      - "server/webui_embed.go"
      - "fly.nandutest.toml"
      - "server/runtime_inventory.go"
      - "server/runtime_inventory_test.go"
      - "Dockerfile.nandutest"
      - "web/src/app/(main)/system/**"
      - "web/src/components/ndt/**"
      - "web/src/lib/api.ts"
      - "web/src/lib/runtime-inventory.ts"
      - "web/src/navigation/sidebar/sidebar-items.ts"
      - "server/getangiru_bridge.go"
      - "server/getangiru_bridge_test.go"
      - "server/getangiru_feedback.go"
      - "server/server.go"
      - "web/src/components/ndt/getangiru-integration.tsx"
      - "web/src/lib/getangiru.ts"
      - "docs/nandutest-getangiru-bridge.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-artex-global-py
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build, vet and test without shared DB contamination
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1
      - name: RBAC and revocation integration against ephemeral PostgreSQL
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./server/ -count=1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web quality and static build
        working-directory: web
        run: |
          npm ci
          npm run check:i18n
          npm run check -- --max-diagnostics=1200
          npm run build:static
      - name: Test exported embedded frontend routes
        run: |
          mkdir -p server/webui/dist
          cp -a web/out/. server/webui/dist/
          go test -tags embedui ./server -run '^TestEmbeddedWebUIEntry$' -count=1
      - name: Offline security pilot smoke tests
        run: |
          bash -n scripts/nandutest-pilot.sh
          python3 -m unittest scripts/test_nandutest_pilot.py -v
          POSTGRES_PASSWORD=ci-placeholder docker compose -f docker-compose.yml -f docker-compose.local-llm.yml config --quiet

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate release permissions and backup prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "::error::Missing FLY_API_TOKEN; no production change"; exit 1; }
          echo "Pre-existing data volume snapshot: vs_e5b8v92gO27uQJ8oeXV2JpD"
          flyctl auth whoami >/dev/null
          flyctl secrets list -a artex-global-py | grep -q ARTEX_PG_DSN
          flyctl secrets list -a artex-global-py | grep -q ARTEX_ADMIN_PASSWORD
      - name: In-place production rollout and automatic rollback on failure
        shell: bash
        run: |
          set -Eeuo pipefail
          attempted=0
          previous_image="$(flyctl machine status 48ed55df52e648 -a artex-global-py --json | jq -r '.config.image // empty' || true)"
          onexit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$attempted" -eq 1 ]; then
              if [[ "$previous_image" == registry.fly.io/artex-global-py:deployment-* ]]; then
                echo "::warning::Release failed. Restoring last known Ñandutest image."
                flyctl deploy --app artex-global-py --config fly.nandutest.toml --image "$previous_image" --remote-only --ha=false --strategy immediate --yes || true
              else
                echo "::error::Release verification failed. Previous image is not verified Ñandutest; refusing legacy ARTEX rollback. Inspect current instance."
              fi
            fi
            exit "$rc"
          }
          trap onexit EXIT
          attempted=1
          flyctl deploy --app artex-global-py --config fly.nandutest.toml --dockerfile Dockerfile.nandutest --remote-only --ha=false --strategy immediate --yes
          ready=0
          for i in $(seq 1 12); do
            health="$(curl -fsS --max-time 15 https://artex-global-py.fly.dev/api/health || true)"
            if HEALTH_JSON="$health" python3 -c 'import json,os; d=json.loads(os.environ["HEALTH_JSON"]); assert d.get("ok") is True and d.get("version") == "nandutest-pilot"' 2>/dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::New Ñandutest binary did not respond with expected version"
            exit 1
          fi
          status="$(curl -fsS --max-time 20 https://artex-global-py.fly.dev/api/auth/status)"
          AUTH_STATUS="$status" python3 -c 'import json,os; d=json.loads(os.environ["AUTH_STATUS"]); assert d.get("initialized") is True'
          root_ready=0
          # A replacement may be healthy before the public Fly proxy routes
          # every request to the updated instance.
          for i in $(seq 1 24); do
            root_status="$(curl -sS --max-time 10 -o /dev/null -D /tmp/ndt_root_headers -w '%{http_code}' https://artex-global-py.fly.dev/ || true)"
            if [ "$root_status" = "302" ] && grep -iq '^location: /login' /tmp/ndt_root_headers; then
              root_ready=1
              break
            fi
            echo "Root redirect pending (attempt $i HTTP $root_status)"
            sleep 4
          done
          if [ "$root_ready" != "1" ]; then
            echo "::error::Root is not redirecting after proxy propagation"
            exit 1
          fi
          login_html="$(curl -fsS --max-time 15 https://artex-global-py.fly.dev/login)"
          if echo "$login_html" | grep -q 'id="__next_error__"'; then
            echo "::error::Login returned Next error shell"
            exit 1
          fi
          echo "$login_html" | grep -q '<html' || { echo "::error::Login HTML missing"; exit 1; }
          echo "Root redirect and login HTML verified"
          assert_unauthenticated_401() {
            local method="$1" path="$2" code=""
            for i in $(seq 1 12); do
              code="$(curl -sS --connect-timeout 5 --max-time 20 -o /dev/null -w '%{http_code}' -X "$method" "https://artex-global-py.fly.dev$path" || true)"
              [ "$code" = "401" ] && return 0
              echo "Auth check retry $i: $path returned HTTP ${code:-unavailable}"
              sleep 5
            done
            echo "::error::Protected route $path did not return 401 after retries (last HTTP $code)"
            return 1
          }
          assert_unauthenticated_401 GET /api/users
          for path in /api/runtime/getangiru /api/runtime/getangiru/search /api/runtime/getangiru/feedback /api/runtime/shared-model/test; do
            method=GET
            case "$path" in
              */search|*/feedback|*/test) method=POST ;;
            esac
            assert_unauthenticated_401 "$method" "$path"
          done
          attempted=0
          flyctl status --app artex-global-py
          echo "Production Ñandutest API smoke checks passed."
