name: Ñandutest formatting preview
on:
  push:
    branches:
      - feature/nandutest-local-llm-rbac
    paths:
      - .github/workflows/nandutest-format-preview.yml
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Format only changed TypeScript and TSX files
        run: |
          npx biome check --write "src/app/(main)/system/users/page.tsx" "src/app/(main)/_components/sidebar/app-sidebar.tsx" "src/app/(auth)/login/page.tsx" "src/navigation/sidebar/sidebar-items.ts" "src/app/(main)/_components/sidebar/nav-main.tsx" "src/lib/auth.ts" "src/hooks/use-current-user.ts" || true
      - name: Print precise formatted content for GitHub connector application
        run: |
          node - <<'JS'
          const fs = require("fs");
          const paths = [
            "src/app/(main)/system/users/page.tsx",
            "src/app/(main)/_components/sidebar/app-sidebar.tsx",
            "src/app/(auth)/login/page.tsx",
            "src/navigation/sidebar/sidebar-items.ts",
            "src/app/(main)/_components/sidebar/nav-main.tsx",
            "src/lib/auth.ts",
            "src/hooks/use-current-user.ts",
          ];
          for (const path of paths) {
            console.log("NANDUTEST_FORMAT=" + JSON.stringify({path: "web/" + path, content: fs.readFileSync(path, "utf8")}));
          }
          JS
