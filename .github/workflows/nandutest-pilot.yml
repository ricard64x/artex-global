name: nandutest-pilot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read
concurrency:
  group: nandutest-pilot-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'deploy/nandutest-production' }}
      - name: Shell syntax
        run: bash -n scripts/nandutest-pilot.sh
      - name: Offline unit tests and isolated 8-phase access validation
        run: |
          python3 -m unittest scripts/test_nandutest_pilot.py scripts/test_nandutest_pilot_lab.py -v
          python3 scripts/nandutest_pilot_lab.py --authorize-lab > "$RUNNER_TEMP/nandutest_lab.json"
          python3 - "$RUNNER_TEMP/nandutest_lab.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['completed'] and d['synthetic_access_verified']
          assert not d['real_target_tested'] and not d['real_access_demonstrated']
          assert len(d['phases'])==8 and all(x['state']=='passed' for x in d['phases'])
          print('8/8 LAB phases verified; no external target or actual penetration')
          PY
      - name: Compose configuration validation, no model download
        env:
          POSTGRES_PASSWORD: ci-placeholder
          ARTEX_SETUP_TOKEN: ci-setup-placeholder
        run: docker compose -f docker-compose.yml -f docker-compose.local-llm.yml config --quiet
      - name: Verify no Ollama public port
        run: |
          ! grep -Eq '^[[:space:]]+ports:' docker-compose.local-llm.yml
          grep -q -- '--network none' scripts/nandutest-pilot.sh

  continuous-source-audit:
    # Nightly source audit only, no production network requests.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/nandutest-production
      - name: Prepare scanner images and offline vulnerability database
        shell: bash
        run: |
          set -euo pipefail
          docker pull semgrep/semgrep:latest
          docker pull aquasec/trivy:latest
          mkdir -p data/trivy-cache
          timeout 420 docker run --rm \
            -v "$GITHUB_WORKSPACE/data/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy:latest image --download-db-only --no-progress
      - name: Audit source checkout, no network in scan containers
        shell: bash
        run: |
          set -euo pipefail
          export NANDUTEST_APPROVED_ROOT="$GITHUB_WORKSPACE"
          bash scripts/nandutest-pilot.sh "$GITHUB_WORKSPACE"
          python3 scripts/nandutest_metrics.py --reports data/pilot-reports > "$RUNNER_TEMP/ndt-metrics.json"
          python3 - "$RUNNER_TEMP/ndt-metrics.json" <<'PY'
          import json,sys,os
          d=json.load(open(sys.argv[1]))
          assert d['jobs_total']>=1 and d['jobs_complete']>=1
          assert d['precision_reviewed_pct'] is None or d['human_reviewed']>0
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Ñandutest - revisión continua de código\n')
              f.write('Alcance: checkout del repositorio; sin solicitudes a sistemas externos.\n\n')
              f.write('| Indicador | Valor |\n|---|---:|\n')
              for name,key in [('Escaneos','jobs_total'),('Completados','jobs_complete'),
                  ('Alertas Semgrep','semgrep_alerts'),('Alertas Trivy','trivy_alerts'),
                  ('Confirmados por humano','verified_findings')]:
                  f.write(f'| {name} | {d[key] if d[key] is not None else "Pendiente de revisión"} |\n')
          PY
      - name: Save aggregate-only metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nandutest-nightly-summary
          path: data/pilot-reports/*/metrics.json
          if-no-files-found: ignore
          retention-days: 14
