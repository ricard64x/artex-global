# Ñandutest / Artex: local model via isolated Ollama, no public port.
# docker compose -f docker-compose.yml -f docker-compose.local-llm.yml up -d postgres ollama
# docker compose -f docker-compose.yml -f docker-compose.local-llm.yml exec ollama ollama pull qwen3:4b
# docker compose -f docker-compose.yml -f docker-compose.local-llm.yml up -d artex
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "2m"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
    volumes:
      - nandutest_models:/root/.ollama
    mem_limit: 6g
    cpus: "2.0"
    # No ports: internal Docker network only
  artex:
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      ARTEX_LLM_PROVIDER: openai
      ARTEX_LLM_MODEL: qwen3:4b
      ARTEX_LLM_BASE_URL: http://ollama:11434/v1
      OPENAI_API_KEY: local-only-ollama
      ARTEX_LLM_STREAM: "true"
volumes:
  nandutest_models:
